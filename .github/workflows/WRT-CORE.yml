#云编译公用核心
name: WRT-CORE

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_COUNTRY:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: true
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        default: false
        type: boolean

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_COUNTRY: ${{inputs.WRT_COUNTRY}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_SOURCE: ${{inputs.WRT_SOURCE}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Projects
        uses: actions/checkout@main

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf \
            /opt/az \
            /opt/ghc \
            /opt/google \
            /opt/hostedtoolcache \
            /opt/microsoft \
            /opt/pipx \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/local/.ghcup \
            /usr/local/julia* \
            /usr/local/lib/android \
            /usr/local/lib/node_modules \
            /usr/local/share/boost \
            /usr/local/share/chromium \
            /usr/local/share/edge_driver \
            /usr/local/share/gecko_driver \
            /usr/local/share/powershell \
            /usr/local/share/vcpkg

          if command -v docker >/dev/null 2>&1; then
            sudo docker system prune -af --volumes
          fi

          if swapon --show=NAME --noheadings | grep -qx "/mnt/swapfile"; then
            sudo swapoff /mnt/swapfile
            sudo rm -f /mnt/swapfile
          fi

          sudo -E apt -yqq purge firefox
          sudo -E apt -yqq update
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E apt -yqq install dos2unix libfuse-dev clang llvm
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Initialization Values
        run: |
          WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[^=_]+(?=\=y)' "./Config/$WRT_CONFIG.txt")
          WRT_SUBTARGET=$(grep -m 1 -oP "^CONFIG_TARGET_${WRT_TARGET}_\K[^=_]+(?=\=y)" "./Config/$WRT_CONFIG.txt")
          echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV
          echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}" >> $GITHUB_ENV
          echo "WRT_INFO=${WRT_SOURCE%%/*}" >> $GITHUB_ENV
          echo "WRT_TARGET=$WRT_TARGET" >> $GITHUB_ENV
          echo "WRT_SUBTARGET=$WRT_SUBTARGET" >> $GITHUB_ENV
          echo "WRT_WIFI=wifi-yes" >> $GITHUB_ENV
          echo "WRT_KVER=none" >> $GITHUB_ENV
          echo "WRT_LIST=none" >> $GITHUB_ENV

      - name: Clone Code
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/

          cd ./wrt/
          WRT_HASH=$(git rev-parse HEAD)
          WRT_HOST_ID=$(. /etc/os-release && printf '%s-%s' "$ID" "$VERSION_ID")
          export WRT_HOST_ID
          WRT_CACHE_PREFIX=$(bash "$GITHUB_WORKSPACE/Scripts/CacheKey.sh")
          echo "WRT_HASH=$WRT_HASH" >> "$GITHUB_ENV"
          echo "WRT_CACHE_PREFIX=$WRT_CACHE_PREFIX" >> "$GITHUB_ENV"
          echo "Build source: $WRT_HASH"
          echo "Compatible cache prefix: $WRT_CACHE_PREFIX"

          # GitHub Action 移除国内下载源
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Restore Build Cache
        id: restore-build-cache
        if: env.WRT_TEST != 'true'
        uses: actions/cache/restore@v5
        with:
          key: ${{env.WRT_CACHE_PREFIX}}-full-${{env.WRT_HASH}}
          restore-keys: |
            ${{env.WRT_CACHE_PREFIX}}-full-
            ${{env.WRT_CACHE_PREFIX}}-warm-${{env.WRT_HASH}}
            ${{env.WRT_CACHE_PREFIX}}-warm-
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host
            ./wrt/staging_dir/toolchain-*

      - name: Update Caches
        if: env.WRT_TEST != 'true' && steps.restore-build-cache.outputs.cache-matched-key != ''
        run: |
          find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
            find "$DIR" -type f -exec touch {} +
          done
          mkdir -p ./wrt/tmp && echo "1" > ./wrt/tmp/.build
          echo "Restored compatible tools and toolchain."

      - name: Update Feeds
        run: |
          cd ./wrt/

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Packages
        run: |
          cd ./wrt/

          $GITHUB_WORKSPACE/Scripts/Packages.sh
          $GITHUB_WORKSPACE/Scripts/Handles.sh
          $GITHUB_WORKSPACE/Scripts/Miniupnpd.sh
          bash $GITHUB_WORKSPACE/Scripts/LuciUpnp.sh

      - name: Custom Settings
        run: |
          cd ./wrt/

          if [[ "${WRT_CONFIG,,}" == *"test"* ]]; then
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt >> .config
          else
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt $GITHUB_WORKSPACE/Config/GENERAL.txt $GITHUB_WORKSPACE/Config/EXTRA.txt >> .config
          fi

          $GITHUB_WORKSPACE/Scripts/Settings.sh

          make defconfig -j$(nproc) && make clean -j$(nproc)
          bash "$GITHUB_WORKSPACE/Scripts/CheckOwrt.sh" config .config
          echo "BPF/LLVM configuration after defconfig:"
          grep -E 'CONFIG_(BPF_TOOLCHAIN|USE_LLVM|HAS_BPF|NEED_BPF)' .config || true
          command -v clang
          clang --version | head -n 1

      - name: Prewarm Build Cache
        if: env.WRT_TEST != 'true' && steps.restore-build-cache.outputs.cache-matched-key == ''
        run: |
          cd ./wrt/

          make tools/install toolchain/install -j$(nproc)

      - name: Save Warm Build Cache
        if: env.WRT_TEST != 'true' && steps.restore-build-cache.outputs.cache-matched-key == ''
        uses: actions/cache/save@v5
        with:
          key: ${{env.WRT_CACHE_PREFIX}}-warm-${{env.WRT_HASH}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host
            ./wrt/staging_dir/toolchain-*

      - name: Download Packages
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          make download -j$(nproc)

      - name: Compile Firmware
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          make -j$(nproc) || make -j1 V=s

      - name: Save Full Build Cache
        if: env.WRT_TEST != 'true' && success() && steps.restore-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          key: ${{env.WRT_CACHE_PREFIX}}-full-${{env.WRT_HASH}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host
            ./wrt/staging_dir/toolchain-*

      - name: Machine Information
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir ./upload/

          cp -f ./.config ./upload/Config-"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt
          cp package/openwrt-daede/ci/DAEDE-SOURCE.txt ./upload/
          cp package/openwrt-honk/ci/HONK-SOURCE.txt ./upload/
          cp feeds/packages/net/miniupnpd/ci-source.txt ./upload/MINIUPNPD-SOURCE.txt
          cp feeds/luci/applications/luci-app-upnp/ci-luci-upnp-source.txt ./upload/LUCI-UPNP-SOURCE.txt
          {
            printf 'source=%s\nbranch=%s\ncommit=%s\nprofile=%s\n' "$WRT_REPO" "$WRT_BRANCH" "$WRT_HASH" "$WRT_CONFIG"
            sha256sum package/qca-nss/nss-wifi-drv/Makefile package/qca-nss/nss-firmware/Makefile \
              package/emortal/luci-app-qca-ppe-qos/Makefile package/network/config/qca-ppe-qos/Makefile
            grep -E '^CONFIG_(ATH11K_NSS_WIFI|PACKAGE_(kmod-nss-wifi-drv|nss-firmware|luci-app-qca-ppe-qos|qca-ppe-qos))=' .config
          } > ./upload/PPE-NSS-SOURCE.txt

          if [[ $WRT_TEST != 'true' ]]; then
            mapfile -t MANIFESTS < <(find ./bin/targets/ -type f -name '*.manifest')
            if [[ ${#MANIFESTS[@]} -eq 0 ]]; then
              echo '::error::No firmware manifest available to verify PPE/NSS packages'
              exit 1
            fi
            for MANIFEST in "${MANIFESTS[@]}"; do
              bash "$GITHUB_WORKSPACE/Scripts/CheckOwrt.sh" manifest "$MANIFEST"
            done
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" >> $GITHUB_ENV
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV

            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} +

            for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TARGET*") ; do
              EXT=$(basename $FILE | cut -d '.' -f 2-)
              NAME=$(basename $FILE | cut -d '.' -f 1 | grep -io "\($WRT_TARGET\).*")
              NEW_FILE="$NAME"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_WIFI"-"$WRT_DATE"."$EXT"
              mv -f $FILE ./upload/$NEW_FILE
            done

            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;

            make clean -j$(nproc)
          fi

      - name: Release Firmware
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-${{env.WRT_DATE}}
          files: ./wrt/upload/*.*
          body: |

            源码：${{env.WRT_REPO}}
            分支：${{env.WRT_BRANCH}}
            提交：${{env.WRT_HASH}}

            配置：${{env.WRT_CONFIG}}
            平台：${{env.WRT_TARGET}}

            登录地址：${{env.WRT_IP}}
            登录密码：${{env.WRT_PW}}

            WIFI名称：${{env.WRT_SSID}}
            WIFI密码：${{env.WRT_WORD}}

            内核版本：${{env.WRT_KVER}}
            插件列表：${{env.WRT_LIST}}
